<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script>
	function init() {
		let canvas = document.getElementById("myCanvas");
		let context = canvas.getContext("2d");
		
		// 선형 그레이디언트 효과 x, y, x1, y1
		// gradient : 기울기  gradation : 그라데이션
		let grad = context.createLinearGradient(0, 0, 200, 0);
		grad.addColorStop(0, "aqua");
		grad.addColorStop(0.25, "green");
		grad.addColorStop(0.5, "red");
		grad.addColorStop(0.75, "pink");
		grad.addColorStop(1, "blue");
		context.fillStyle = grad;
		context.fillRect(10,10,180,90);
	}
</script>
</head>
<body onload="init()">
	<canvas id="myCanvas" width="300px" height="200px"></canvas>
</body>
</html>
